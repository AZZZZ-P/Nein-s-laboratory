<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三栏对照阅读器</title>
<style>
  :root{
    --bg:#f7f6f3; --panel:#fff; --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e1db;
    --accent:#0f6bd6; --accent-soft:#e9f2fd; --hl:#ffe9a8; --hl-ink:#5a4300;
    --zh-active:#f2f8ff; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(20,20,20,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#15161a;--panel:#1c1d22;--ink:#eceef2;--muted:#9a9aa4;--line:#2c2e35;
      --accent:#6ab0ff;--accent-soft:#1b2b45;--hl:#5c4a12;--hl-ink:#ffe9a8;--zh-active:#1c2836;--shadow:none;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.75;-webkit-font-smoothing:antialiased;
    height:100vh;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Georgia,serif}
  header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
    padding:11px 22px 9px;box-shadow:var(--shadow)}
  h1{margin:0;font-size:16px}
  h1 .zh{font-weight:500;color:var(--muted);font-size:13.5px;margin-left:8px}
  .sub{margin:3px 0 8px;color:var(--muted);font-size:12px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
  .bar nav{display:flex;flex-wrap:wrap;gap:4px}
  .bar nav a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--bg)}
  .bar nav a:hover{border-color:var(--accent);color:var(--accent)}
  .bar nav a.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .bar input{font:inherit;font-size:12.5px;padding:4px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:180px}
  .bar input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .bar .pill{font-size:11.5px;color:var(--muted);min-width:58px}
  .bar .sp{margin-left:auto;font-variant-numeric:tabular-nums}
  .bar button{font:inherit;font-size:12.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 9px;cursor:pointer}
  .bar button:hover{border-color:var(--accent);color:var(--accent)}
  kbd{font-family:ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}

  .grid{display:grid;grid-template-columns:1.18fr 1fr .92fr;align-items:start;height:calc(100vh - var(--headh,80px))}
  .col{min-width:0;padding:14px 20px 45vh;height:100%;overflow-y:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .col::-webkit-scrollbar{width:9px}
  .col::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
  .col+.col{border-left:1px solid var(--line)}
  .colhead{position:sticky;top:-1px;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);
    margin:-14px -20px 12px;padding:8px 20px;font-size:11.5px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
  .colhead b{color:var(--accent);letter-spacing:0;text-transform:none;font-size:12.5px;margin-left:8px}

  h2.sec{font-size:14px;margin:26px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line);
    color:var(--ink);cursor:pointer;font-weight:600}
  h2.sec:hover{color:var(--accent)}
  h2.sec:first-of-type{margin-top:4px}
  h2.sec .en{color:var(--muted);font-weight:400;font-size:12.5px;display:block;margin-top:2px}
  .colZ h2.sec .en{display:none}
  p.para{margin:0 0 14px;font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.95;text-align:justify}
  .colZ .pwrap{margin:0 0 6px}
  div.front{margin:0 0 14px;padding:8px 11px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:12px;line-height:1.7}
  div.front .sent{font-size:12px}
  div.front .zh{font-size:12px;padding:4px 8px;margin-bottom:6px}
  p.para.title{font-size:17px;line-height:1.5;font-weight:600;text-align:left}
  .sent{padding:1px 2px;border-radius:4px;cursor:pointer;transition:background .12s,box-shadow .12s;
    box-decoration-break:clone;-webkit-box-decoration-break:clone}
  .sent .no{font-family:-apple-system,sans-serif;font-size:9.5px;color:var(--muted);vertical-align:super;margin-right:2px}
  .sent:hover{background:var(--accent-soft)}
  .sent.active{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent)}
  .sent.active .no{color:var(--accent);font-weight:700}
  .sent.hit{background:#e6f6e9;box-shadow:inset 0 -1px 0 #35a35b}
  .colZ .zh{display:block;margin:0 0 8px;padding:9px 12px;border:1px solid var(--line);border-left:3px solid transparent;
    border-radius:8px;background:var(--panel);cursor:pointer;font-size:14.5px;line-height:1.85;transition:background .12s,border-color .12s}
  .colZ .zh:hover{border-color:var(--accent)}
  .colZ .zh.active{background:var(--zh-active);border-left-color:var(--accent);box-shadow:var(--shadow)}
  .colZ .zh .no{font-size:10px;color:var(--muted);display:block;margin-bottom:1px;font-variant-numeric:tabular-nums}
  .colZ .zh.active .no{color:var(--accent);font-weight:700}
  .colZ .zh.hit{background:#eefaf0;border-left-color:#35a35b}
  div.fn{margin:0 0 14px;padding:8px 11px;border-left:2px dashed var(--accent);background:var(--panel);border-radius:0 8px 8px 0}
  div.fn .tag{font-size:10.5px;letter-spacing:1px;color:var(--accent);display:block;margin-bottom:3px;font-weight:600}
  div.fn .sent{font-size:13px;color:var(--muted)}
  div.fn .zh{font-size:13px}
  mark.w{background:var(--hl);color:var(--hl-ink);border-radius:3px;padding:0 1px;box-shadow:0 0 0 1px rgba(0,0,0,.06)}

  .words{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
  .word{display:grid;grid-template-columns:22px minmax(0,.95fr) minmax(0,1.4fr);gap:8px;align-items:baseline;
    padding:5px 9px;border-bottom:1px solid var(--line);cursor:default;transition:background .1s}
  .word:last-child{border-bottom:0}
  .word .idx{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
  .word .en{font-family:Georgia,serif;font-size:14px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
  .word .cn{font-size:13px;line-height:1.55;overflow-wrap:anywhere}
  .word .note{color:var(--muted);font-size:11.5px}
  .word:hover,.word.pinned{background:var(--accent-soft)}
  .word.pinned .en{color:var(--accent)}
  .word.miss{opacity:.55}
  .whead{font-size:12.5px;color:var(--muted);margin:0 0 9px;line-height:1.6}
  .whead b{color:var(--ink)}
  .empty{color:var(--muted);font-size:13px;padding:14px}
  /* 窄屏：三栏无法并存，退回整页滚动（原文/译文/逐栏依次纵向排列） */
  @media (max-width:1080px){
    body{height:auto;overflow:auto}
    .grid{grid-template-columns:1fr 1fr;height:auto}
    .col{height:auto;overflow:visible;padding-bottom:70vh}
    .colhead{top:var(--headh,80px)}
    #colW{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
  }
  @media (max-width:720px){.grid{grid-template-columns:1fr}.col+.col{border-left:0;border-top:1px solid var(--line)}#colW{grid-column:auto}}

  /* ---------- 读书笔记面板 ---------- */
  .sent.noted::after{content:'●';color:#f0a020;font-size:9px;vertical-align:super;margin-left:2px}
  .colZ .zh.noted{box-shadow:inset 3px 0 0 #f0a020}
  .colZ .zh.noted.active{box-shadow:inset 3px 0 0 #f0a020,var(--shadow)}
  #noteFab{position:fixed;right:18px;bottom:18px;z-index:35;font:inherit;font-size:13px;cursor:pointer;
    background:var(--accent);color:#fff;border:0;border-radius:999px;padding:9px 16px;box-shadow:0 6px 22px rgba(15,107,214,.35)}
  #noteFab b{font-weight:700;margin-left:2px}
  #noteFab.hide{display:none}
  body.panel-on{padding-right:min(430px,92vw)}
  #panel{position:fixed;top:0;right:0;bottom:0;width:min(430px,92vw);z-index:40;background:var(--panel);
    border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.10);display:flex;flex-direction:column;
    transform:translateX(101%);transition:transform .18s ease}
  #panel.open{transform:none}
  .ph{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
  .ph b{font-size:14px}
  .ph #pctx{color:var(--muted);font-size:11.5px;margin-left:auto}
  .ph button{border:1px solid var(--line);background:var(--panel);border-radius:7px;font:inherit;font-size:13px;
    color:var(--ink);cursor:pointer;padding:2px 9px}
  .pbody{flex:1;overflow-y:auto;padding:13px 14px 26px;overscroll-behavior:contain}
  .quote{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;background:var(--bg);
    padding:9px 11px;font-size:13px;line-height:1.7;min-height:40px;max-height:150px;overflow:auto}
  .quote .qzh{color:var(--muted);font-size:12px;margin-top:4px}
  .qrow{display:flex;gap:6px;margin:7px 0 9px;flex-wrap:wrap}
  .qrow button,.prow button{font:inherit;font-size:12px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
    border-radius:7px;padding:4px 10px;cursor:pointer}
  .qrow button:hover,.prow button:hover{border-color:var(--accent);color:var(--accent)}
  .prow{display:flex;align-items:center;gap:9px;margin:8px 0}
  button.pri{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;font-weight:600}
  textarea{width:100%;font:inherit;font-size:13.5px;line-height:1.75;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;resize:vertical;box-sizing:border-box}
  textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  h4.pt{margin:18px 0 7px;font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;font-weight:600}
  .plist{display:flex;flex-direction:column;gap:8px}
  .note{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);font-size:12.5px;line-height:1.7}
  .note .nh{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:11px;margin-bottom:3px}
  .note .nh .go{cursor:pointer;color:var(--accent)}
  .note .nh button{margin-left:auto;font:inherit;font-size:11px;border:1px solid var(--line);background:var(--panel);
    border-radius:5px;padding:1px 6px;color:var(--muted);cursor:pointer}
  .note .nh button:hover{color:#d0433f;border-color:#d0433f}
  .note .q{color:var(--muted);font-style:italic}
  .note .t{margin-top:3px;white-space:pre-wrap}
  .hint{color:var(--muted);font-size:11.5px;line-height:1.65}
  .pdig{white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;
    line-height:1.7;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;max-height:340px;overflow:auto}
  #selPop{position:fixed;z-index:50;background:var(--ink);color:var(--bg);font-size:12px;border-radius:7px;
    padding:5px 10px;cursor:pointer;box-shadow:var(--shadow)}
  @media (max-width:1080px){body.panel-on{padding-right:0}#panel{width:min(430px,100vw)}}
</style>
</head>
<body>
<header class="top">
  <h1 id="docTitle"></h1>
  <div class="sub" id="docMeta"></div>
  <div class="bar">
    <nav id="nav"></nav>
    <input id="q" type="search" placeholder="搜索英文，回车逐句跳转" autocomplete="off">
    <span id="qhit" class="pill"></span>
    <span><kbd>j</kbd><kbd>k</kbd> 切句 · 点词行可锁定高亮 · <kbd>n</kbd> 读书笔记</span>
    <button id="bp" title="上一句">↑</button><button id="bn" title="下一句">↓</button>
    <span class="sp" id="counter"></span>
  </div>
</header>

<main class="grid">
  <section class="col" id="colE">
    <div class="colhead">原文 <b>Original</b></div>
    <div id="enRoot"></div>
  </section>
  <section class="col colZ" id="colZ">
    <div class="colhead">译文 <b>Translation</b></div>
    <div id="zhRoot"></div>
  </section>
  <section class="col" id="colW">
    <div class="colhead">逐词 <b>Word by word</b></div>
    <p class="whead" id="whead">点击左栏原文或中栏译文中的任意一句开始。</p>
    <div class="words" id="words"><div class="empty">尚未选择句子</div></div>
  </section>
</main>

<button id="noteFab" title="读书笔记（快捷键 n）">✎ 笔记 <b id="noteCount">0</b></button>

<aside id="panel" aria-hidden="true">
  <div class="ph"><b>✎ 读书笔记</b><span id="pctx"></span><button id="pclose" title="关闭 (Esc)">✕</button></div>
  <div class="pbody">
    <div class="quote" id="pquote"></div>
    <div class="qrow">
      <button id="qsent" title="把当前选中句作为点评对象">引用当前句</button>
      <button id="qsel" title="先在左栏/中栏选中一段文字，再点此">引用选中文字</button>
      <button id="qclr" title="清除引用片段">整句</button>
    </div>
    <textarea id="pinput" rows="4" placeholder="针对上面的文字写下你的点评、疑问或联想…"></textarea>
    <div class="prow"><button id="psave" class="pri">保存点评</button><span class="hint" id="pedit"></span></div>

    <h4 class="pt">逐条点评（<span id="pcount">0</span>）</h4>
    <div class="plist" id="plist"></div>

    <h4 class="pt">整体感悟</h4>
    <textarea id="psum" rows="7" placeholder="通读全文后的总体思考：作者的解释力在哪、与你读过的案例/文献如何对话、你不同意什么。汇总时会作为结尾整段呈现。"></textarea>

    <h4 class="pt">汇总</h4>
    <div class="prow">
      <button id="pdig" class="pri">生成读书感悟</button>
      <button id="pcopy">复制</button>
      <button id="pdl">下载 .md</button>
    </div>
    <pre class="pdig" id="pdigest" hidden></pre>
    <p class="hint" id="pstore"></p>
  </div>
</aside>

<div id="selPop" hidden>点评这段</div>

<script>
const DATA = __DATA__;
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
/* 定位用压缩索引：只保留 Unicode 字母与数字，空格/连字符/斜杠/引号一律忽略
   —— 'vis-à-vis'、'and/or'、'so-called'、带全角标点等写法差异都不会影响定位 */
let KEEP;
try { KEEP = new RegExp('[\\p{L}\\p{N}]', 'u'); } catch (e) { KEEP = /[A-Za-z0-9]/; }
const dropNonAlnum = t => Array.from(t).filter(c => KEEP.test(c)).join('').toLowerCase();
const ckey = w => dropNonAlnum(w);

/* META：文档标题、副标题、笔记存储键、感悟导出名（由 data.json 提供，模板不含任何具体文章信息） */
const META = DATA.meta || {};
const SLUG = META.slug || 'reader';
document.title = `三栏对照阅读器 · ${META.titleEn || META.titleZh || ''}`;
document.getElementById('docTitle').innerHTML =
  `${esc(META.titleEn || META.titleZh || '')}` +
  (META.titleZh && META.titleEn ? `<span class="zh">${esc(META.titleZh)}</span>` : '');
document.getElementById('docMeta').textContent = META.byline || '';

/* ---------- 1. 展平句子序列，并为每个词条计算在原文中的字符区间 ---------- */
const S = [];
DATA.sections.forEach((sec, si) => {
  sec.paras.forEach(par => {
    par.sents.forEach(s => {
      const idx = [];
      for (let k = 0; k < s.en.length; k++) if (KEEP.test(s.en[k])) idx.push(k);
      const compact = idx.map(k => s.en[k].toLowerCase()).join('');
      let cur = 0;
      s.spans = s.t.map(t => {
        const key = ckey(t[0]); if (!key) return null;
        let p = compact.indexOf(key, cur); if (p < 0) p = compact.indexOf(key);
        if (p < 0) return null;
        cur = p + key.length;
        return [idx[p], idx[p + key.length - 1] + 1];
      });
      s.gi = S.length; s.si = si; s.pk = par.key; s.kind = par.kind; s.label = par.label;
      s.title = (par.title === true);
      S.push(s);
    });
  });
});

/* ---------- 2. 渲染左栏（原文，按段落成组）与中栏（译文，逐句成块） ---------- */
const sentHtml = i => `<span class="no">${i + 1}</span>${esc(S[i].en)}`;
let enH = '', zhH = '', lastSec = -1, openP = null;
const closeP = () => { if (!openP) return;
  enH += openP.kind === 'para' || openP.kind === 'title' ? '</p>' : '</div>';
  zhH += '</div>'; openP = null; };
S.forEach(s => {
  if (s.si !== lastSec) {
    closeP();
    const sec = DATA.sections[s.si], h = sec.head || {};
    const label = esc(h.zh || sec.id);
    const sub = h.en ? `<span class="en">${esc(h.en)}</span>` : '';
    enH += `<h2 class="sec" data-si="${s.si}">${label}${sub}</h2>`;
    zhH += `<h2 class="sec" data-si="${s.si}">${label}</h2>`;
    lastSec = s.si;
  }
  if (!openP || openP.pk !== s.pk || openP.si !== s.si) {
    closeP();
    const kind = s.title ? 'title' : s.kind;
    openP = {pk: s.pk, si: s.si, kind};
    const lab = s.kind === 'footnote' ? `<span class="tag">${esc(s.label || '脚注')}</span>` : '';
    if (s.kind === 'para') enH += `<p class="para${s.title ? ' title' : ''}" data-pk="${s.pk}">`;
    else enH += `<div class="${s.kind === 'footnote' ? 'fn' : 'front'}" data-pk="${s.pk}">${lab}`;
    zhH += `<div class="pwrap ${s.kind}${s.title ? ' title' : ''}" data-pk="${s.pk}">${lab}`;
  }
  enH += `<span class="sent" data-i="${s.gi}">${sentHtml(s.gi)}</span> `;
  zhH += `<div class="zh" data-i="${s.gi}"><span class="no">第 ${s.gi + 1} 句</span>${esc(s.zh)}</div>`;
});
closeP();
document.getElementById('enRoot').innerHTML = enH;
document.getElementById('zhRoot').innerHTML = zhH;

/* ---------- 3. 顶部节导航 ---------- */
document.getElementById('nav').innerHTML = DATA.sections.map((s, i) => {
  const t = ((s.head && s.head.zh) || s.id).replace(/^\d+\.\s*/, '');
  return `<a href="#" data-si="${i}">${esc(t)}</a>`;
}).join('');

/* ---------- 4. 交互 ---------- */
const $ = id => document.getElementById(id);
let cur = -1, pinned = -1, query = '', hits = [], hcur = -1;
const sentEl = i => document.querySelector(`.sent[data-i="${i}"]`);
const zhEl = i => document.querySelector(`.zh[data-i="${i}"]`);

function restoreSent(i){ const e = sentEl(i); if (e) e.innerHTML = sentHtml(i); }

function markWord(j){
  const s = S[cur], el = sentEl(cur);
  if (!el) return;
  const sp = s.spans[j];
  if (!sp) { restoreSent(cur); return; }
  el.innerHTML = `<span class="no">${cur + 1}</span>` + esc(s.en.slice(0, sp[0])) +
    `<mark class="w">${esc(s.en.slice(sp[0], sp[1]))}</mark>` + esc(s.en.slice(sp[1]));
}

function renderWords(){
  const s = S[cur];
  const ok = s.spans.filter(Boolean).length;
  const tag = s.kind === 'footnote' ? esc(s.label || '脚注') : s.kind === 'meta' ? '题录信息' : '正文';
  $('whead').innerHTML = `第 <b>${cur + 1}</b> 句 · <b>${s.t.length}</b> 个词条（${ok} 个可在左栏定位）· ${tag}`;
  $('words').innerHTML = s.t.map((t, j) => {
    const m = t[1].match(/^([^（(]*)(.*)$/);
    const cn = (m[1] || '').trim(), note = (m[2] || '').trim();
    return `<div class="word${s.spans[j] ? '' : ' miss'}" data-j="${j}">` +
      `<span class="idx">${j + 1}</span><span class="en">${esc(t[0])}</span>` +
      `<span class="cn">${esc(cn)}${note ? ` <span class="note">${esc(note)}</span>` : ''}</span></div>`;
  }).join('');
}

function scrollCol(el){                       // 定位到可见区域；已经完整可见则不动
  if (!el) return;
  const c = el.closest('.col');
  // 可见区域 = 该栏矩形 ∩ 窗口视口。窄屏回退为整页滚动时，栏矩形本身高达数万像素，
  // 只按栏矩形判断会误认为"已可见"，导致页面不滚动。
  const cr = c ? c.getBoundingClientRect() : {top:0, bottom:window.innerHeight};
  const top = Math.max(cr.top, 0), bot = Math.min(cr.bottom, window.innerHeight);
  const boxH = bot - top;
  if (boxH <= 0) return;
  const r = el.getBoundingClientRect(), pad = 20;
  if (r.height <= boxH - 2 * pad && r.top >= top + pad && r.bottom <= bot - pad) return;
  const dist = Math.abs(r.top - (top + (boxH - r.height) / 2));
  el.scrollIntoView({behavior: dist < boxH * 0.8 ? 'smooth' : 'auto', block:'center'});
}

function select(i, from){
  if (cur >= 0 && cur !== i) restoreSent(cur);
  cur = Math.max(0, Math.min(S.length - 1, i));
  pinned = -1;
  document.querySelectorAll('.sent').forEach(e => e.classList.toggle('active', +e.dataset.i === cur));
  document.querySelectorAll('#zhRoot .zh').forEach(e => e.classList.toggle('active', +e.dataset.i === cur));
  document.querySelectorAll('.word').forEach(e => e.classList.remove('pinned'));
  renderWords();
  restoreSent(cur);
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', +a.dataset.si === S[cur].si));
  $('counter').textContent = `第 ${cur + 1} / ${S.length} 句`;
  if (typeof paintNotes === 'function'){
    paintNotes();
    if (typeof panelOpen === 'function' && panelOpen()) setQuote();
  }
  if (from === false) return;                        // 初始化：不动
  const wCol = $('colW');
  if (wCol && wCol.scrollTop) wCol.scrollTop = 0;    // 换句后逐词栏回到顶部
  if (from === 'en') scrollCol(zhEl(cur));           // 点左栏 → 中栏定位到该句
  else if (from === 'zh') scrollCol(sentEl(cur));    // 点中栏 → 左栏定位到该句
  else { scrollCol(sentEl(cur)); scrollCol(zhEl(cur)); }  // 键盘/导航/搜索/笔记跳转：两栏都跟
}

document.addEventListener('click', e => {
  const nav = e.target.closest('nav a'), sec = e.target.closest('h2.sec');
  if (nav || sec){
    e.preventDefault();
    const si = +(nav || sec).dataset.si;
    const first = S.find(s => s.si === si);
    if (first) select(first.gi);
    return;
  }
  const sent = e.target.closest('.sent'), zh = e.target.closest('#zhRoot .zh');
  if (sent){ select(+sent.dataset.i, 'en'); return; }
  if (zh){ select(+zh.dataset.i, 'zh'); return; }
  const w = e.target.closest('.word');
  if (w){
    const j = +w.dataset.j;
    pinned = (pinned === j) ? -1 : j;
    document.querySelectorAll('.word').forEach(x => x.classList.toggle('pinned', +x.dataset.j === pinned));
    if (pinned < 0) restoreSent(cur); else markWord(pinned);
  }
});
document.addEventListener('mouseover', e => { const w = e.target.closest('.word'); if (w && pinned < 0) markWord(+w.dataset.j); });
document.addEventListener('mouseout', e => {
  const w = e.target.closest('.word'); if (!w || pinned >= 0) return;
  const rt = e.relatedTarget;
  if (!(rt && rt.closest && rt.closest('.word'))) restoreSent(cur);
});
$('bp').onclick = () => select(cur - 1);
$('bn').onclick = () => select(cur + 1);
document.addEventListener('keydown', e => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA'){
    if (e.target.id === 'q' && e.key === 'Enter') jumpHit();
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.key === 'n' || e.key === 'N'){ e.preventDefault(); panelOpen() ? closePanel() : openPanel(); }
  else if (e.key === 'ArrowDown' || e.key === 'j'){ e.preventDefault(); select(cur + 1); }
  else if (e.key === 'ArrowUp' || e.key === 'k'){ e.preventDefault(); select(cur - 1); }
  else if (e.key === 'Escape'){
    if (panelOpen()){ closePanel(); return; }
    pinned = -1; document.querySelectorAll('.word').forEach(x => x.classList.remove('pinned')); restoreSent(cur);
  }
});

/* ---------- 5. 搜索（只切换 class，不重建 DOM） ---------- */
function applyHits(){
  document.querySelectorAll('.sent.hit, #zhRoot .zh.hit').forEach(e => e.classList.remove('hit'));
  hits = [];
  if (!query){ $('qhit').textContent = ''; return; }
  const q = query.toLowerCase();
  S.forEach(s => {
    if (s.en.toLowerCase().includes(q) || s.zh.includes(query)){
      hits.push(s.gi);
      const a = sentEl(s.gi), b = zhEl(s.gi);
      if (a) a.classList.add('hit');
      if (b) b.classList.add('hit');
    }
  });
  hcur = -1;
  $('qhit').textContent = hits.length ? `命中 ${hits.length} 句` : '无命中';
}
function jumpHit(){
  if (!hits.length) return;
  hcur = (hcur + 1) % hits.length;
  select(hits[hcur]);
}
$('q').addEventListener('input', e => { query = e.target.value.trim(); applyHits(); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); jumpHit(); } });

/* ---------- 6. sticky 列标题偏移量 ---------- */
const setHead = () => document.documentElement.style.setProperty('--headh',
  Math.round(document.querySelector('header.top').getBoundingClientRect().height) + 'px');
window.addEventListener('resize', setHead); setHead();

/* ---------- 7. 读书笔记：逐条点评 + 汇总成读书感悟 ---------- */
const LS = `qoder.${SLUG}.notes.v1`;
let store = {notes: [], summary: ''}, storageOK = true;
try {
  const raw = localStorage.getItem(LS);
  if (raw) { const o = JSON.parse(raw); if (o && Array.isArray(o.notes)) store = {notes: o.notes, summary: o.summary || ''}; }
} catch (e) { storageOK = false; }

let pendingQuote = null, editingId = null, lastSel = '';
const panelOpen = () => $('panel').classList.contains('open');
const notesOf = i => store.notes.filter(n => n.gi === i);
const secName = si => { const sec = DATA.sections[si], h = sec && sec.head; return (h && h.zh) || (sec && sec.id) || ''; };

function refreshStore(){
  $('pstore').textContent = storageOK
    ? '笔记自动保存在本机浏览器（localStorage），下次打开还在；换设备前请用「下载 .md」备份。'
    : '注意：当前浏览器不允许本地存储（部分浏览器限制 file:// 页面写入），笔记只在本次会话有效，请务必用「下载 .md」备份。';
}
function persist(){
  try { localStorage.setItem(LS, JSON.stringify(store)); storageOK = true; }
  catch (e) { storageOK = false; }
  refreshStore();
}
function paintNotes(){
  document.querySelectorAll('#enRoot .sent').forEach(e => e.classList.toggle('noted', notesOf(+e.dataset.i).length > 0));
  document.querySelectorAll('#zhRoot .zh').forEach(e => e.classList.toggle('noted', notesOf(+e.dataset.i).length > 0));
  $('noteCount').textContent = store.notes.length;
  $('pcount').textContent = store.notes.length;
}
function setQuote(){
  const s = S[cur], q = pendingQuote || s.en;
  $('pquote').innerHTML = `<div class="q">${esc(q)}</div>` +
    (pendingQuote ? '' : `<div class="qzh">${esc(s.zh)}</div>`);
  $('pctx').textContent = `当前第 ${cur + 1} 句 · ${secName(s.si)}`;
  $('qclr').style.visibility = pendingQuote ? 'visible' : 'hidden';
}
function openPanel(){
  $('panel').classList.add('open'); $('panel').setAttribute('aria-hidden', 'false');
  document.body.classList.add('panel-on'); $('noteFab').classList.add('hide');
  setQuote(); setTimeout(() => $('pinput').focus(), 130);
}
function closePanel(){
  $('panel').classList.remove('open'); $('panel').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('panel-on'); $('noteFab').classList.remove('hide');
}
function renderList(){
  const list = [...store.notes].sort((a, b) => a.gi - b.gi || a.ts - b.ts);
  $('plist').innerHTML = list.length ? list.map(n => `
    <div class="note" data-id="${n.id}">
      <div class="nh"><span class="go" data-i="${n.gi}" title="跳到该句">第 ${n.gi + 1} 句</span>
        <span>${esc(secName(n.si))}</span><button data-act="edit">编辑</button><button data-act="del">删除</button></div>
      ${n.quote ? `<div class="q">「${esc(n.quote)}」</div>` : ''}
      <div class="t">${esc(n.text)}</div>
    </div>`).join('')
    : `<div class="hint">还没有点评。点一句原文（或选中任意一段文字），按 <kbd>n</kbd> 打开这里记录。</div>`;
}
function flash(msg){ $('pedit').textContent = msg; setTimeout(() => { if ($('pedit').textContent === msg) $('pedit').textContent = ''; }, 1800); }
function saveNote(){
  const text = $('pinput').value.trim();
  if (!text){ flash('先写点什么再保存'); return; }
  if (editingId){
    const old = store.notes.find(x => x.id === editingId);
    if (old){ old.text = text; old.quote = pendingQuote || ''; old.gi = cur; old.si = S[cur].si; }
    editingId = null;
  } else {
    store.notes.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      gi: cur, si: S[cur].si, quote: pendingQuote || '', text, ts: Date.now()});
  }
  pendingQuote = null; $('pinput').value = '';
  persist(); renderList(); paintNotes(); setQuote(); flash('已保存 ✓');
}
function buildDigest(){
  const notes = [...store.notes].sort((a, b) => a.gi - b.gi || a.ts - b.ts);
  const sum = $('psum').value.trim();
  const parts = new Set(notes.map(n => n.si)).size;
  const docName = META.titleZh || META.titleEn || '本文';
  let md = `# ${docName} · 读书感悟\n\n`;
  (META.cite ? [].concat(META.cite) : []).forEach(c => { md += `> ${c}\n`; });
  md += '> 阅读方式：中英三栏逐词对照精读。共 ' + notes.length + ' 条点评，涉及 ' + parts + ' 个部分。\n\n';
  if (!notes.length) md += '_（尚未记录逐条点评。）_\n\n';
  DATA.sections.forEach((sec, si) => {
    const g = notes.filter(n => n.si === si);
    if (!g.length) return;
    md += '\n## ' + ((sec.head && sec.head.zh) || sec.id) + '\n\n';
    g.forEach(n => {
      const s = S[n.gi];
      md += '### 第 ' + (n.gi + 1) + ' 句\n\n';
      md += '> 原文：' + s.en + '\n';
      if (n.quote) md += '> 聚焦：「' + n.quote + '」\n';
      md += '> 译文：' + s.zh + '\n\n';
      md += n.text.replace(/\n{3,}/g, '\n\n').trim() + '\n\n';
    });
  });
  md += '\n## 整体感悟\n\n' + (sum ? sum.trim() : '_（待补充：作者的解释力在哪里、与你读过的案例或文献如何对话、你不同意什么。）_') + '\n';
  return md;
}
function copyDigest(){
  const md = buildDigest();
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = md; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove(); flash(ok ? '已复制 ✓' : '复制失败，请用「下载 .md」');
  };
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(md).then(() => flash('已复制到剪贴板 ✓'), fallback);
  else fallback();
}
function downloadDigest(){
  const md = buildDigest();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([md], {type: 'text/markdown;charset=utf-8'}));
  a.download = (META.notesFile || `${SLUG}_读书感悟`) + '.md';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  flash('已下载 .md ✓');
}

$('noteFab').onclick = openPanel;
$('pclose').onclick = closePanel;
$('qsent').onclick = () => { pendingQuote = null; setQuote(); $('pinput').focus(); };
$('qclr').onclick  = () => { pendingQuote = null; setQuote(); };
$('qsel').onclick  = () => {
  if (lastSel) { pendingQuote = lastSel; setQuote(); $('pinput').focus(); }
  else flash('先在左栏或中栏用鼠标选中一段文字');
};
$('psave').onclick = saveNote;
$('pinput').addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); saveNote(); }
});
$('psum').value = store.summary;
$('psum').addEventListener('input', e => { store.summary = e.target.value; persist(); });
$('pdig').onclick = () => { const el = $('pdigest'); el.textContent = buildDigest(); el.hidden = false; el.scrollIntoView({block: 'nearest'}); };
$('pcopy').onclick = copyDigest;
$('pdl').onclick = downloadDigest;
$('plist').addEventListener('click', e => {
  const item = e.target.closest('.note'); if (!item) return;
  const n = store.notes.find(x => x.id === item.dataset.id); if (!n) return;
  const go = e.target.closest('.go');
  if (go) { select(+go.dataset.i, 'note'); return; }
  const btn = e.target.closest('button'); if (!btn) return;
  if (btn.dataset.act === 'del') {
    store.notes = store.notes.filter(x => x.id !== n.id);
    if (editingId === n.id) { editingId = null; $('pinput').value = ''; $('pedit').textContent = ''; }
    persist(); renderList(); paintNotes(); return;
  }
  if (btn.dataset.act === 'edit') {
    editingId = n.id; $('pinput').value = n.text; pendingQuote = n.quote || null;
    select(n.gi, false); setQuote(); $('pedit').textContent = '编辑中，保存后覆盖原条';
    $('pinput').focus();
  }
});

/* 选中文字 → 浮出「点评这段」 */
document.addEventListener('mouseup', e => {
  if (e.target.closest('#panel') || e.target.closest('#selPop')) return;
  const sel = window.getSelection(), txt = sel ? sel.toString().trim() : '';
  const node = sel && sel.anchorNode ? (sel.anchorNode.parentElement || sel.anchorNode) : null;
  const inCols = node && node.closest && node.closest('#enRoot, #zhRoot');
  const pop = $('selPop');
  if (txt && txt.length <= 400 && inCols) {
    lastSel = txt; pop.hidden = false;
    pop.style.left = Math.min(e.clientX + 8, window.innerWidth - 100) + 'px';
    pop.style.top = Math.min(e.clientY + 14, window.innerHeight - 44) + 'px';
  } else { pop.hidden = true; }
});
$('selPop').onclick = () => { $('selPop').hidden = true; openPanel(); setQuote(); };

renderList(); paintNotes(); refreshStore();

select(0, false);
</script>
</body>
